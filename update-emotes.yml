name: Update emote counts

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC (off the top of the hour, when Actions is busiest)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      refresh:
        description: "Re-query every emote (off = only fetch emotes new in emotes.txt)"
        type: boolean
        default: true

# Never run two refreshes at once (they'd fight over the commit).
concurrency:
  group: update-emotes
  cancel-in-progress: false

permissions:
  contents: write            # needed to push emotes.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90      # ~330 emotes x 1.5 s is ~10 min; the rest is headroom for rate limiting
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --refresh re-queries emotes that already have a count; without it the
      # script would only fetch emotes that are new in emotes.txt.
      # Scheduled runs always refresh; manual runs follow the "refresh" checkbox.
      # If the script fails, this step fails and nothing below runs, so a
      # half-finished emotes.json is never committed.
      - name: Collect counts
        run: node collect.mjs ${{ (github.event_name == 'schedule' || inputs.refresh) && '--refresh' || '' }}

      - name: Sanity check output
        run: |
          node -e '
            const d = JSON.parse(require("fs").readFileSync("emotes.json", "utf8"));
            const n = d.emotes.filter((e) => typeof e.count === "number").length;
            console.log(`emotes.json has ${n} counted emotes`);
            if (n < 100) { console.error("Too few emotes, refusing to commit"); process.exit(1); }
          '

      - name: Commit emotes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emotes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update emote counts"
            git push
          fi
